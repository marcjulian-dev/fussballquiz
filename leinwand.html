<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08152b"><title>Fußballquiz – Leinwand</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f7ff;background:#08152b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1c3859 0,#08152b 65%);min-height:100vh}.stage{max-width:1450px;min-height:100vh;margin:auto;padding:clamp(20px,3vw,52px);display:flex;flex-direction:column;gap:25px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #43617d;padding-bottom:22px}.brand{font-size:clamp(19px,2.1vw,30px);font-weight:800}.meta{background:#1a354f;border:1px solid #4c7190;padding:11px 19px;border-radius:999px;font-size:clamp(15px,1.4vw,21px)}h1{font-size:clamp(38px,5vw,79px);line-height:1.15;margin:10px 0 22px}h2{font-size:clamp(24px,2.4vw,40px);margin:4px 0}.tag{color:#6ff0b0;font-size:clamp(18px,1.7vw,27px);font-weight:750;letter-spacing:.025em}.body{flex:1;display:flex;flex-direction:column;justify-content:center}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.choice{background:#203650;border:1px solid #52718c;padding:clamp(18px,2.1vw,32px);border-radius:16px;font-size:clamp(19px,2vw,34px);line-height:1.2;display:flex;gap:18px;align-items:center}.choice em{font-style:normal;color:#69edaa;font-weight:850}.panel{background:#1b3049;border:1px solid #486783;border-radius:20px;padding:30px}.answer{font-size:clamp(27px,3.3vw,52px);color:#73f4b4;font-weight:800}.expl{color:#cedae9;font-size:clamp(19px,1.7vw,29px)}.rank{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid #385572;font-size:clamp(18px,1.7vw,27px)}.rank b{white-space:nowrap}.gridrank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 36px}.roundcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.roundcard{border:1px solid #45647e;background:#172c44;border-radius:12px;padding:16px}.roundcard h3{margin:6px 0;font-size:clamp(18px,1.6vw,24px)}.roundcard p{margin:8px 0;color:#78efb5;font-size:clamp(18px,1.6vw,25px);font-weight:700}.footer{display:flex;justify-content:space-between;align-items:center;color:#aabed3;font-size:clamp(12px,1.2vw,18px);padding-top:14px}.err{color:#ffb0a6}button{background:#254664;color:white;border:1px solid #53718a;border-radius:9px;font:inherit;padding:10px 14px;cursor:pointer}#controls{display:flex;gap:10px}#notice{margin-top:20px}.hide{display:none!important}@media(max-width:650px){.choices,.gridrank,.roundcards{grid-template-columns:1fr}.head{flex-wrap:wrap}.stage{gap:12px}.body{justify-content:flex-start}}
</style><script src="./config.js"></script></head><body><div class="stage"><header class="head"><div class="brand">⚽ Das große Fußballquiz <span style="color:#9db7d2;font-weight:500">· Leinwand</span></div><div id="meta" class="meta">Live-Anzeige</div></header><main id="screen" class="body"><h1>Fußballquiz</h1><p>Leinwandansicht wird geladen …</p></main><div id="notice" role="status" aria-live="polite"></div><footer class="footer"><span>8 Teams · 5 Runden · 25 Fragen</span><div id="controls"><button id="fullscreen" type="button">⛶ Vollbild</button></div></footer></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=window.FQ_CONFIG||{};const el=document.getElementById('screen'),meta=document.getElementById('meta'),notice=document.getElementById('notice');
const rounds=['Torhymnen & Stadionmusik','Deutschlands Fußballstadien','Internationale Weltmeisterschaften','Karlsruher SC','Rekorde & Kuriositäten'];
const token=localStorage.getItem('fq_role')==='mod'?localStorage.getItem('fq_token'):null;
let client,previous='';
const headline=(title,sub)=>`<div class="tag">${esc(sub)}</div><h1>${esc(title)}</h1>`;
function ranking(s){const all=s.ranking||[];return `<div class="gridrank">${all.map((t,i)=>`<div class="rank"><span>${i+1}. ${esc(t.name)} · Tisch ${esc(t.table_number)}</span><b>${esc(t.points)} P.</b></div>`).join('')}</div>`}
function draw(s){let rid=s.round_id||0;meta.textContent=rid?`Runde ${rid} / 5 · ${rounds[rid-1]}`:'8 Teams · 5 Runden';let content='';
if(s.show_ranking){content=headline('Aktuelle Rangliste',rid?`Nach Runde ${rid}`:'Das Ergebnis')+ranking(s)}
else if(s.phase==='review' && s.resolved?.length){content=`<div class="tag">Runde ${rid} · Gemeinsame Auflösung</div><h1>Die richtigen Antworten</h1><div class="roundcards">${s.resolved.map(q=>`<div class="roundcard"><div style="color:#abc5dc">Frage ${esc(q.number)}</div><h3>${esc(q.prompt)}</h3><p>${esc(q.correct_answer)}</p></div>`).join('')}</div>`}
else if(s.question && ['open','closed'].includes(s.phase)){let q=s.question;let opts=Array.isArray(q.choices)?q.choices:[];content=`<div class="tag">Runde ${rid} · Frage ${esc(q.question_number)} von 5${q.question_number===5?' · Bonusfrage':''}</div><h1>${esc(q.prompt)}</h1>${opts.length?`<div class="choices">${opts.map((v,i)=>`<div class="choice"><em>${'ABCD'[i]}</em><span>${esc(v)}</span></div>`).join('')}</div>`:`<div class="panel"><h2>Schätzfrage</h2><p class="expl">Tragt eure Schätzung auf dem Team-Smartphone ein.</p></div>`}${s.phase==='closed'?'<p class="expl">Die Antwortabgabe ist geschlossen.</p>':''}`}
else{content=headline('Willkommen zum Fußballquiz!','Bereit für den Anpfiff')+'<p class="expl">Acht Teams treten in fünf Runden gegeneinander an.</p><div class="panel"><h2>Die nächste Frage startet gleich.</h2></div>'}
el.innerHTML=content}
async function update(){try{if(!client)return;const {data,error}=await client.rpc('quiz_state',{p_token:token});if(error)throw Error(error.message);if(!data?.ok)throw Error(data?.error||'Spielstand konnte nicht geladen werden');const signature=JSON.stringify(data);if(signature!==previous){previous=signature;draw(data)}notice.textContent='';}catch(e){notice.textContent='Verbindung: '+e.message;notice.className='err'}}
document.getElementById('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};
if(!cfg.url?.startsWith('https://')||!cfg.key?.startsWith('sb_publishable_')){el.innerHTML=headline('Konfiguration fehlt','Einrichtung')+'<p class="expl">Öffne die Leinwandansicht auf GitHub Pages, neben der bestehenden config.js.</p>'}
else if(!token){el.innerHTML=headline('Moderatoren-Anmeldung erforderlich','Leinwand aktivieren')+'<p class="expl">Melde Dich im selben Browser zuerst in der <a style="color:#6ff0b0" href="./">Moderatorenansicht</a> an und öffne anschließend diese Leinwandseite in einem neuen Tab.</p><p class="expl">Die Leinwand verwendet Deinen bestehenden Moderatorzugang; es wird kein zweiter Code benötigt.</p>'}
else{client=createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});update();setInterval(()=>{if(!document.hidden)update()},2000)}
</script></body></html>
