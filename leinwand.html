<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08152b"><title>Fußballquiz – Leinwand</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f7ff;background:#08152b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1c3859 0,#08152b 65%);min-height:100vh}.stage{max-width:1450px;min-height:100vh;margin:auto;padding:clamp(20px,3vw,52px);display:flex;flex-direction:column;gap:25px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #43617d;padding-bottom:22px}.brand{font-size:clamp(19px,2.1vw,30px);font-weight:800}.meta{background:#1a354f;border:1px solid #4c7190;padding:11px 19px;border-radius:999px;font-size:clamp(15px,1.4vw,21px)}h1{font-size:clamp(38px,5vw,79px);line-height:1.15;margin:10px 0 22px}h2{font-size:clamp(24px,2.4vw,40px);margin:4px 0}.tag{color:#6ff0b0;font-size:clamp(18px,1.7vw,27px);font-weight:750;letter-spacing:.025em}.body{flex:1;display:flex;flex-direction:column;justify-content:center}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.choice{background:#203650;border:1px solid #52718c;padding:clamp(18px,2.1vw,32px);border-radius:16px;font-size:clamp(19px,2vw,34px);line-height:1.2;display:flex;gap:18px;align-items:center}.choice em{font-style:normal;color:#69edaa;font-weight:850}.panel{background:#1b3049;border:1px solid #486783;border-radius:20px;padding:30px}.answer{font-size:clamp(27px,3.3vw,52px);color:#73f4b4;font-weight:800}.expl{color:#cedae9;font-size:clamp(19px,1.7vw,29px)}.rank{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid #385572;font-size:clamp(18px,1.7vw,27px)}.rank b{white-space:nowrap}.gridrank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 36px}.roundcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.roundcard{border:1px solid #45647e;background:#172c44;border-radius:12px;padding:16px}.roundcard h3{margin:6px 0;font-size:clamp(18px,1.6vw,24px)}.roundcard p{margin:8px 0;color:#78efb5;font-size:clamp(18px,1.6vw,25px);font-weight:700}.progress-area{margin-top:clamp(20px,3vw,44px);padding:20px 24px;border:1px solid #486783;border-radius:16px;background:#152a43}.progress-head{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:clamp(18px,1.6vw,27px);font-weight:700}.progress-head strong{color:#73f4b4;font-size:clamp(24px,2.7vw,43px);white-space:nowrap}.progress-track{height:clamp(12px,1.2vw,18px);border-radius:100px;overflow:hidden;background:#415976;margin-top:16px}.progress-fill{height:100%;background:#73f4b4;border-radius:100px;transition:width .35s}.footer{display:flex;justify-content:space-between;align-items:center;color:#aabed3;font-size:clamp(12px,1.2vw,18px);padding-top:14px}.err{color:#ffb0a6}button{background:#254664;color:white;border:1px solid #53718a;border-radius:9px;font:inherit;padding:10px 14px;cursor:pointer}#controls{display:flex;gap:10px}#notice{margin-top:20px}.hide{display:none!important}@media(max-width:650px){.choices,.gridrank,.roundcards{grid-template-columns:1fr}.head{flex-wrap:wrap}.stage{gap:12px}.body{justify-content:flex-start}}
.welcome{text-align:center;align-items:center;gap:20px}.welcome h1{margin:8px 0;font-size:clamp(46px,6vw,100px)}.join{display:flex;gap:38px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;margin-top:18px}.qr{padding:16px;border-radius:16px;background:white;width:234px;height:234px;display:grid;place-items:center}.qr canvas,.qr img{max-width:100%}.join-url{font-size:clamp(18px,2vw,30px);overflow-wrap:anywhere;color:#a5eccc}.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,2vw,38px);margin:25px auto 35px;width:min(1050px,100%)}.podium-item{width:32%;text-align:center;min-width:0}.podium-team{font-size:clamp(17px,2vw,34px);font-weight:800;overflow-wrap:anywhere}.podium-score{font-size:clamp(15px,1.6vw,24px);color:#b7c9df;margin:8px 0 16px}.podium-step{display:grid;place-items:center;border-radius:14px 14px 0 0;color:#0b1930;font-size:clamp(32px,4vw,70px);font-weight:900;height:clamp(90px,15vw,210px);background:#b9c4d2}.podium-item:nth-child(2) .podium-step{height:clamp(130px,21vw,290px);background:#f0c75b}.podium-item:nth-child(3) .podium-step{height:clamp(70px,11vw,155px);background:#c58a61}.transition{text-align:center;align-items:center}.transition h1{font-size:clamp(40px,6vw,95px)}@media(max-width:650px){.qr{width:190px;height:190px}.podium{gap:8px}}

/* Große Frage- und Antwortkacheln bei Einzelauflösung */
.qa-stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,1fr);gap:24px;align-items:stretch;margin-top:14px}
.qa-tile{background:#172c44;border:1px solid #45647e;border-radius:20px;padding:clamp(22px,2.4vw,42px);min-height:260px;display:flex;flex-direction:column;justify-content:center;overflow-wrap:anywhere}
.qa-tile .qa-label{color:#abc5dc;font-size:clamp(17px,1.5vw,24px);font-weight:700;margin-bottom:18px}
.qa-tile.question-tile h2{font-size:clamp(30px,3vw,54px);line-height:1.16;margin:0}
.qa-tile.answer-tile{background:#183650;border-color:#5584a5}
.qa-tile.answer-tile .qa-label{color:#a0efd0}
.qa-answer{font-size:clamp(32px,3.6vw,62px);line-height:1.13;color:#73f4b4;font-weight:850}
.qa-counter{font-size:clamp(16px,1.5vw,23px);color:#b8cadd;margin-top:22px}
@media(max-width:900px){.qa-stage{grid-template-columns:1fr}.qa-tile{min-height:150px}}
</style><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body><div class="stage"><header class="head"><div class="brand">⚽ Das große Fußballquiz <span style="color:#9db7d2;font-weight:500">· Leinwand</span></div><div id="meta" class="meta">Live-Anzeige</div></header><main id="screen" class="body"><h1>Fußballquiz</h1><p>Leinwandansicht wird geladen …</p></main><div id="notice" role="status" aria-live="polite"></div><footer class="footer"><span>8 Teams · 5 Runden · 25 Fragen</span><div id="controls"><button id="fullscreen" type="button">⛶ Vollbild</button></div></footer></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=window.FQ_CONFIG||{};const el=document.getElementById('screen'),meta=document.getElementById('meta'),notice=document.getElementById('notice');
const rounds=['Torhymnen & Stadionmusik','Deutschlands Fußballstadien','Internationale Weltmeisterschaften','Karlsruher SC','Rekorde & Kuriositäten'];
const token=localStorage.getItem('fq_role')==='mod'?localStorage.getItem('fq_token'):null;
let projectionStep=0;let client,previous='', lastRound=0,transitionUntil=0, latestState=null, qrDone=false;
const headline=(title,sub)=>`<div class="tag">${esc(sub)}</div><h1>${esc(title)}</h1>`;
function ranking(s){const all=[...(s.ranking||[])].sort((a,b)=>Number(b.points||0)-Number(a.points||0)||Number(a.table_number||0)-Number(b.table_number||0));return `<div class="gridrank">${all.map((t,i)=>`<div class="rank"><span>${i+1}. ${esc(t.name)} · Tisch ${esc(t.table_number)}</span><b>${esc(t.points)} P.</b></div>`).join('')}</div>`}
function progress(s){const n=Math.max(0,Math.min(8,Number(s.answer_count)||0));return `<section class="progress-area" aria-label="Eingegangene Antworten"><div class="progress-head"><span>Antworten eingegangen</span><strong>${n} / 8</strong></div><div class="progress-track"><div class="progress-fill" style="width:${n/8*100}%"></div></div></section>`}
const joinUrl='https://marcjulian-dev.github.io/fussballquiz/';
function welcome(){return `<div class="welcome body"><div class="tag">⚽ 8 Teams · 5 Runden · 25 Fragen</div><h1>Das große Fußballquiz</h1><p class="expl">Willkommen zum Kneipenquiz – gleich geht’s los!</p><div class="join"><div id="qrcode" class="qr" aria-label="QR-Code zum Quiz-Link"></div><div style="text-align:left"><div class="tag">Jetzt mitspielen</div><h2>Link öffnen · Teamcode eingeben</h2><p class="join-url">${esc(joinUrl)}</p><p class="expl">Ein Smartphone pro Tisch reicht aus.</p></div></div></div>`}
function makeQr(){if(!document.getElementById('qrcode'))return;if(typeof QRCode==='undefined'){document.getElementById('qrcode').textContent='QR-Code wird geladen …';return;}new QRCode(document.getElementById('qrcode'),{text:joinUrl,width:200,height:200,colorDark:'#0b1930',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
function podium(s){const sorted=[...(s.ranking||[])].sort((a,b)=>Number(b.points||0)-Number(a.points||0)||Number(a.table_number||0)-Number(b.table_number||0));const winners=[sorted[1],sorted[0],sorted[2]];return `<div class="tag">FINALE · 5 VON 5 RUNDEN</div><h1>🏆 Siegerehrung</h1><div class="podium">${winners.map((t,i)=>`<div class="podium-item"><div class="podium-team">${esc(t?.name||'–')}</div><div class="podium-score">${t?esc(t.points)+' Punkte':' '}</div><div class="podium-step">${[2,1,3][i]}.</div></div>`).join('')}</div><h2>Endstand</h2>${ranking(s)}`}
function draw(s){latestState=s;let rid=Number(s.round_id)||0;meta.textContent=rid?`Runde ${rid} / 5 · ${rounds[rid-1]}`:'8 Teams · 5 Runden';let content='';
if(Date.now()<transitionUntil&&rid>0){content=`<div class="transition body"><div class="tag">NÄCHSTE KATEGORIE</div><h1>Runde ${rid} von 5</h1><h2>${esc(rounds[rid-1])}</h2><p class="expl">Die nächste Frage beginnt gleich.</p></div>`}
else if(s.show_ranking && rid===5){content=podium(s)}
else if(s.show_ranking){content=headline('Aktuelle Rangliste',rid?`Nach Runde ${rid}`:'Das Ergebnis')+ranking(s)}
else if(s.phase==='review' && s.resolved?.length){
  const all=s.resolved;
  const step=Math.max(0,Math.min(all.length,projectionStep));
  if(step===0){
    content=`<div class="tag">Runde ${rid} · Gemeinsame Auflösung</div><h1>Die Auflösung beginnt</h1><div class="panel"><h2>Die Antworten folgen einzeln.</h2><p class="expl">Die Quizleitung gibt die Lösungen nacheinander frei.</p></div>`;
  }else if(step<all.length){
    const item=all[step-1];
    content=`<div class="tag">Runde ${rid} · Gemeinsame Auflösung</div><h1>Antwort ${step} von ${all.length}</h1><div class="qa-stage"><section class="qa-tile question-tile"><div class="qa-label">Frage ${esc(item.number)}</div><h2>${esc(item.prompt)}</h2></section><section class="qa-tile answer-tile"><div class="qa-label">RICHTIGE ANTWORT</div><div class="qa-answer">${esc(item.correct_answer)}</div></section></div><div class="qa-counter">Auflösung ${step} / ${all.length}</div>`;
  }else{
    content=`<div class="tag">Runde ${rid} · Gemeinsame Auflösung</div><h1>Alle fünf Lösungen</h1><div class="roundcards">${all.map(item=>`<div class="roundcard"><div style="color:#abc5dc">Frage ${esc(item.number)}</div><h3>${esc(item.prompt)}</h3><p>${esc(item.correct_answer)}</p></div>`).join('')}</div>`;
  }
}
else if(s.phase==='closed'){content=`<div class="transition body"><div class="tag">RUNDE ${rid} ABGESCHLOSSEN</div><h1>🔒 Antworten gesperrt</h1><p class="expl">Die Antwortabgabe ist beendet.</p><h2>Gleich folgt die gemeinsame Auflösung.</h2></div>`}
else if(s.question && s.phase==='open'){let q=s.question;let opts=Array.isArray(q.choices)?q.choices:[];content=`<div class="tag">Runde ${rid} · Frage ${esc(q.question_number)} von 5${q.question_number===5?' · Bonusfrage':''}</div><h1>${esc(q.prompt)}</h1>${opts.length?`<div class="choices">${opts.map((v,i)=>`<div class="choice"><em>${'ABCD'[i]}</em><span>${esc(v)}</span></div>`).join('')}</div>`:`<div class="panel"><h2>Schätzfrage</h2><p class="expl">Tragt eure Schätzung auf dem Team-Smartphone ein.</p></div>`}${progress(s)}${s.phase==='closed'?'<p class="expl">Die Antwortabgabe ist geschlossen.</p>':''}`}
else{content=welcome()}
el.innerHTML=content;
if(content.includes('id="qrcode"'))makeQr();
}
async function update(){try{if(!client)return;const {data,error}=await client.rpc('quiz_state',{p_token:token});if(error)throw Error(error.message);if(!data?.ok)throw Error(data?.error||'Spielstand konnte nicht geladen werden');const rid=Number(data.round_id)||0;
if(lastRound!==0&&rid>lastRound&&data.phase==='open'){transitionUntil=Date.now()+4500}
lastRound=rid;
if(data.phase==='review'){
 const {data:proj,error:projError}=await client.rpc('quiz_projection_get',{p_token:token});
 if(projError)throw Error(projError.message);
 projectionStep=Number(proj?.step)||0;
}else{projectionStep=0}
const signature=JSON.stringify([data,projectionStep]);
if(signature!==previous|| (transitionUntil&&Date.now()>=transitionUntil)){previous=signature;if(Date.now()>=transitionUntil)transitionUntil=0;draw(data)}notice.textContent='';}catch(e){notice.textContent='Verbindung: '+e.message;notice.className='err'}}
document.getElementById('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};
if(!cfg.url?.startsWith('https://')||!cfg.key?.startsWith('sb_publishable_')){el.innerHTML=headline('Konfiguration fehlt','Einrichtung')+'<p class="expl">Öffne die Leinwandansicht auf GitHub Pages, neben der bestehenden config.js.</p>'}
else if(!token){el.innerHTML=headline('Moderatoren-Anmeldung erforderlich','Leinwand aktivieren')+'<p class="expl">Melde Dich im selben Browser zuerst in der <a style="color:#6ff0b0" href="./">Moderatorenansicht</a> an und öffne anschließend diese Leinwandseite in einem neuen Tab.</p><p class="expl">Die Leinwand verwendet Deinen bestehenden Moderatorzugang; es wird kein zweiter Code benötigt.</p>'}
else{client=createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});update();setInterval(()=>{if(!document.hidden)update()},2000)}
</script></body></html>
