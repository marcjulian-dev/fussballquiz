<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d33"><title>Fußballquiz – Mobile Testversion</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f7ff;background:#0b1424}*{box-sizing:border-box}body{margin:0}header{background:#142641;padding:18px 15px;border-bottom:2px solid #60dda3}.wrap{max-width:660px;margin:auto;padding:0 15px}h1{margin:0;font-size:24px}h2{margin:0 0 14px;font-size:21px}.sub{color:#b7c6dc}.tag{font-size:12px;color:#68e3aa;letter-spacing:.08em;text-transform:uppercase;font-weight:800}main{padding-top:20px;padding-bottom:70px}.card{border:1px solid #33445f;background:#172940;border-radius:17px;padding:19px;margin-bottom:14px}.choice{display:block;width:100%;text-align:left;background:#263d59;border:2px solid transparent;color:white;border-radius:12px;padding:14px;margin:9px 0;font-size:16px}.choice.selected{border-color:#68e3aa}.choice.right{border-color:#6ee7b7;background:#1c614a}.choice.wrong{border-color:#fa9191;background:#612b41}.btn{width:100%;border:0;padding:15px;border-radius:12px;background:#68e3aa;color:#0b291e;font-size:16px;font-weight:800;margin:7px 0;cursor:pointer}.btn.alt{background:#385574;color:white}.btn:disabled{opacity:.5}input{background:#0b182c;color:white;border:1px solid #63809e;border-radius:10px;font-size:17px;padding:13px;width:100%;margin:7px 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border-radius:20px;background:#27523c;padding:5px 10px;font-size:12px}.good{color:#88f4ba}.muted{color:#b5c5d9;font-size:14px}.hide{display:none}.score{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #3b4c67}.small{font-size:13px}.line{border:0;border-top:1px solid #3d5068;margin:18px 0}button:focus-visible,input:focus-visible{outline:3px solid #92cdff} </style></head><body><header><div class="wrap row"><h1>⚽ Fußballquiz</h1><span class="pill">TESTMODUS</span></div></header><main class="wrap"><div id="login" class="card"><h2>Auf dem Handy testen</h2><p class="sub">Diese Datei funktioniert ohne Server. Du kannst die Team- und Moderatorensicht auf diesem Gerät ausprobieren.</p><label>Teamcode</label><input id="code" value="TEST01" autocapitalize="characters"/><button class="btn" onclick="login('team')">Als Team anmelden</button><hr class="line"><label>Moderator-PIN</label><input id="pin" value="2468" type="text"/><button class="btn alt" onclick="login('admin')">Als Moderator anmelden</button><p id="error" style="color:#ffabab"></p></div><div id="app" class="hide"><div class="row" style="margin-bottom:13px"><b id="who"></b><button class="btn alt" style="width:auto;padding:9px 13px;margin:0" onclick="logout()">Wechseln</button></div><div id="content"></div></div><p class="muted small" style="text-align:center">Offline-Demo · nur auf diesem Gerät · kein gemeinsamer Live-Spielstand</p></main><script>
const Q=[{"id": 0, "category": "Torhymnen & Stadionmusik", "question": "Welcher Verein ist für den „Cancan“ als Torhymne bekannt?", "options": ["FC Bayern München", "Werder Bremen", "1. FC Köln", "FC St. Pauli"], "correct": 0, "bonus": false, "points": 1}, {"id": 1, "category": "Torhymnen & Stadionmusik", "question": "Von wem stammt „Maria (I Like It Loud)“?", "options": ["Die Ärzte", "Scooter", "Rammstein", "Seeed"], "correct": 1, "bonus": false, "points": 1}, {"id": 2, "category": "Torhymnen & Stadionmusik", "question": "Bei welchem Verein ist „Bro Hymn“ besonders als Torhymne bekannt?", "options": ["VfB Stuttgart", "Hertha BSC", "RB Leipzig", "Mainz 05"], "correct": 0, "bonus": false, "points": 1}, {"id": 3, "category": "Torhymnen & Stadionmusik", "question": "Wer singt „Denn wenn et Trömmelche jeht“?", "options": ["BAP", "Brings", "De Räuber", "Höhner"], "correct": 2, "bonus": false, "points": 1}, {"id": 4, "category": "Torhymnen & Stadionmusik", "question": "BONUS: Welcher Klub verzichtet traditionell auf eine eingespielte Torhymne?", "options": ["Union Berlin", "Bayer Leverkusen", "VfL Wolfsburg", "Hamburger SV"], "correct": 0, "bonus": true, "points": 2}, {"id": 5, "category": "Deutschlands Fußballstadien", "question": "Welcher Klub spielt im Signal Iduna Park?", "options": ["Bayer Leverkusen", "Borussia Dortmund", "Schalke 04", "VfB Stuttgart"], "correct": 1, "bonus": false, "points": 1}, {"id": 6, "category": "Deutschlands Fußballstadien", "question": "In welcher Stadt steht die Allianz Arena?", "options": ["Berlin", "Frankfurt", "München", "Leipzig"], "correct": 2, "bonus": false, "points": 1}, {"id": 7, "category": "Deutschlands Fußballstadien", "question": "Wie heißt die berühmte Dortmunder Südtribüne auch?", "options": ["Rote Wand", "Gelbe Wand", "Nordkurve", "Blaue Wand"], "correct": 1, "bonus": false, "points": 1}, {"id": 8, "category": "Deutschlands Fußballstadien", "question": "Welches Stadion hat bei nationalen Spielen mehr Plätze?", "options": ["Veltins-Arena", "Olympiastadion Berlin", "Beide gleich viele", "Weserstadion"], "correct": 1, "bonus": false, "points": 1}, {"id": 9, "category": "Deutschlands Fußballstadien", "question": "BONUS: Wie viele Zuschauer fasst der Signal Iduna Park bei Bundesligaspielen ungefähr?", "options": ["52.000", "66.000", "81.000", "95.000"], "correct": 2, "bonus": true, "points": 2}, {"id": 10, "category": "Fußball-Weltmeisterschaften", "question": "Wer wurde 2014 Fußball-Weltmeister der Männer?", "options": ["Spanien", "Deutschland", "Brasilien", "Frankreich"], "correct": 1, "bonus": false, "points": 1}, {"id": 11, "category": "Fußball-Weltmeisterschaften", "question": "Gegen wen gewann Deutschland das WM-Finale 2014?", "options": ["Niederlande", "Brasilien", "Argentinien", "Italien"], "correct": 2, "bonus": false, "points": 1}, {"id": 12, "category": "Fußball-Weltmeisterschaften", "question": "Wer gewann die Männer-WM 2022?", "options": ["Frankreich", "Argentinien", "Kroatien", "England"], "correct": 1, "bonus": false, "points": 1}, {"id": 13, "category": "Fußball-Weltmeisterschaften", "question": "Wer erzielte Deutschlands Siegtor im WM-Finale 2014?", "options": ["Thomas Müller", "Miroslav Klose", "Mario Götze", "Toni Kroos"], "correct": 2, "bonus": false, "points": 1}, {"id": 14, "category": "Fußball-Weltmeisterschaften", "question": "BONUS: In welcher Kombination stehen alle vier deutschen WM-Titeljahre?", "options": ["1954, 1974, 1990, 2014", "1954, 1972, 1990, 2014", "1958, 1974, 1990, 2014", "1954, 1974, 2006, 2014"], "correct": 0, "bonus": true, "points": 2}, {"id": 15, "category": "Karlsruher SC", "question": "Welche Vereinsfarben hat der Karlsruher SC?", "options": ["Rot-Weiß", "Blau-Weiß", "Schwarz-Gelb", "Grün-Weiß"], "correct": 1, "bonus": false, "points": 1}, {"id": 16, "category": "Karlsruher SC", "question": "Wie heißt das Heimstadion des KSC heute?", "options": ["BBBank Wildpark", "Europa-Park Stadion", "PreZero Arena", "Carl-Benz-Stadion"], "correct": 0, "bonus": false, "points": 1}, {"id": 17, "category": "Karlsruher SC", "question": "Welcher spätere Nationaltorwart spielte für den KSC?", "options": ["Manuel Neuer", "Jens Lehmann", "Oliver Kahn", "Marc-André ter Stegen"], "correct": 2, "bonus": false, "points": 1}, {"id": 18, "category": "Karlsruher SC", "question": "Wen besiegte der KSC 1993 im UEFA-Cup sensationell mit 7:0?", "options": ["FC Valencia", "Real Madrid", "FC Barcelona", "Sevilla FC"], "correct": 0, "bonus": false, "points": 1}, {"id": 19, "category": "Karlsruher SC", "question": "BONUS: In welchem Jahr wurde der heutige Karlsruher SC gegründet?", "options": ["1909", "1952", "1963", "1974"], "correct": 1, "bonus": true, "points": 2}, {"id": 20, "category": "Rekorde & Kuriositäten", "question": "Welches Land hat die meisten Männer-WM-Titel gewonnen?", "options": ["Deutschland", "Italien", "Brasilien", "Argentinien"], "correct": 2, "bonus": false, "points": 1}, {"id": 21, "category": "Rekorde & Kuriositäten", "question": "Welcher Klub gewann die meisten Bundesliga-Meisterschaften?", "options": ["Borussia Dortmund", "FC Bayern München", "Werder Bremen", "Hamburger SV"], "correct": 1, "bonus": false, "points": 1}, {"id": 22, "category": "Rekorde & Kuriositäten", "question": "Wie weit liegt der Elfmeterpunkt von der Torlinie entfernt?", "options": ["9 Meter", "10 Meter", "11 Meter", "12 Meter"], "correct": 2, "bonus": false, "points": 1}, {"id": 23, "category": "Rekorde & Kuriositäten", "question": "Wer erzielte in der Bundesliga-Saison 2020/21 insgesamt 41 Tore?", "options": ["Robert Lewandowski", "Erling Haaland", "Harry Kane", "Pierre-Emerick Aubameyang"], "correct": 0, "bonus": false, "points": 1}, {"id": 24, "category": "Rekorde & Kuriositäten", "question": "BONUS: Wie viele WM-Tore schoss Miroslav Klose in seiner Karriere?", "options": ["14", "15", "16", "17"], "correct": 2, "bonus": true, "points": 2}];
const KEY='football-demo-mobile-v1';let role=null;
function newGame(){return {phase:'lobby',current:-1,team:'Die Wildparkhelden',answers:{}}}
let game;try{game=JSON.parse(localStorage.getItem(KEY))||newGame()}catch{game=newGame()}
const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(game))}
function login(r){if(r==='team'&&$('code').value.trim().toUpperCase()!=='TEST01'){$('error').textContent='Test-Teamcode: TEST01';return}if(r==='admin'&&$('pin').value!=='2468'){$('error').textContent='Test-PIN: 2468';return}role=r;$('login').classList.add('hide');$('app').classList.remove('hide');render()}
function logout(){role=null;$('login').classList.remove('hide');$('app').classList.add('hide')}
function answer(n){if(game.phase!=='question')return;game.answers[game.current]=n;save();render()}
function action(a){if(a==='start'){game.phase='question';game.current=0}else if(a==='reveal'&&game.phase==='question')game.phase='reveal';else if(a==='next'&&game.phase==='reveal'){if(game.current===Q.length-1)game.phase='finished';else{game.current++;game.phase='question'}}else if(a==='reset'){if(!confirm('Demo-Spielstand wirklich zurücksetzen?'))return;game=newGame()}save();render()}
function rename(){let s=$('teamname').value.trim();if(s.length<2)return alert('Mindestens 2 Zeichen');game.team=s.slice(0,32);save();render()}
function score(){return Q.reduce((v,q,i)=>v+(i<game.current||i===game.current&&game.phase!=='question'?game.answers[i]===q.correct?q.points:0:0),0)}
function question(){if(game.current<0)return '<div class="card"><h2>Startbereit!</h2><p class="sub">Der Moderator kann das Quiz starten.</p></div>';let q=Q[game.current],a=game.answers[game.current],reveal=['reveal','finished'].includes(game.phase);return `<div class="card"><div class="row"><span class="tag">Runde ${Math.floor(game.current/5)+1} · ${esc(q.category)}</span><span class="pill">${q.bonus?'Bonus · 2 P.':'1 Punkt'}</span></div><p class="muted">Frage ${game.current+1} von 25</p><h2>${esc(q.question)}</h2>${q.options.map((v,i)=>`<button class="choice ${a===i?'selected':''} ${reveal&&q.correct===i?'right':''} ${reveal&&a===i&&i!==q.correct?'wrong':''}" ${game.phase!=='question'||role==='admin'?'disabled':''} onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${esc(v)}</button>`).join('')}${reveal?`<p class="good"><b>Richtig:</b> ${'ABCD'[q.correct]} – ${esc(q.options[q.correct])}</p>`:`<p class="muted">${a===undefined?'Noch keine Antwort ausgewählt.':'Deine Antwort ist gespeichert.'}</p>`}</div>`}
function render(){if(!role)return;$('who').textContent=role==='admin'?'🎙️ Moderation':'📱 '+game.team;let s='';if(role==='admin'){s+=`<div class="card"><h2>Moderatorensteuerung</h2><p class="sub">Status: ${game.phase==='lobby'?'Lobby':game.phase==='question'?'Frage offen':game.phase==='reveal'?'Aufgelöst':'Beendet'}</p>${game.phase==='lobby'?`<button class="btn" onclick="action('start')">Quiz starten</button>`:''}${game.phase==='question'?`<button class="btn" onclick="action('reveal')">Antwort auflösen</button>`:''}${game.phase==='reveal'?`<button class="btn" onclick="action('next')">${game.current===24?'Quiz beenden':'Nächste Frage →'}</button>`:''}<button class="btn alt" onclick="action('reset')">Test zurücksetzen</button></div>`}else{s+=`<div class="card"><label>Teamname</label><input id="teamname" value="${esc(game.team)}"><button class="btn alt" onclick="rename()">Teamname speichern</button></div>`}s+=question();s+=`<div class="card"><h2>🏆 Punkte</h2><div class="score"><span>${esc(game.team)}</span><b>${score()} / 30</b></div><p class="muted">Hier gibt es nur ein simuliertes Team. Die echte Live-Rangliste benötigt einen Server.</p></div>`;$('content').innerHTML=s}
</script></body></html>
