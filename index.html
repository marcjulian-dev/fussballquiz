<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10253a"><title>Das große Fußballquiz</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1522;color:#f8fafc}*{box-sizing:border-box}body{margin:0}header{background:#10253a;border-bottom:2px solid #68d391;padding:17px 20px}.wrap{max-width:1000px;margin:auto}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(22px,4vw,32px);margin:0}h2{margin-top:0}h3{margin:12px 0}.muted{color:#b2c4d6}.small{font-size:13px}.pill{background:#27533f;color:#baf7cf;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700}main{padding:24px 16px 55px}.card{background:#16273a;border:1px solid #30465d;border-radius:17px;padding:22px;margin-bottom:17px;box-shadow:0 8px 26px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}button,input{font:inherit}button{cursor:pointer;background:#63d994;color:#092117;border:0;border-radius:11px;padding:13px 18px;font-weight:800}button:hover{filter:brightness(1.07)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#2c4257;color:white}.danger{background:#ff8d8d;color:#3b0d0d}input{width:100%;padding:13px;border-radius:10px;background:#0e1c2b;color:white;border:1px solid #486076;margin:7px 0 13px}.choices{display:grid;gap:10px;margin-top:18px}.choice{width:100%;background:#243b52;color:white;text-align:left;border:2px solid transparent;display:flex;gap:12px;align-items:center}.choice.selected{border-color:#63d994;background:#204a44}.choice.correct{background:#145f3e;border-color:#7ffaaf}.choice.wrong{background:#63313c;border-color:#ff9292}.letter{background:#101f2e;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;flex-shrink:0}.score{display:grid;grid-template-columns:34px 1fr 48px;gap:10px;padding:11px;border-bottom:1px solid #355069}.score:first-child{background:#234c39;border-radius:9px}.score b:last-child{text-align:right}.hide{display:none!important}.error{color:#ffb1b1}.success{color:#8af0b1}.category{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#8ef0b6}.bigq{font-size:clamp(21px,3.7vw,30px);line-height:1.3;font-weight:750}.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.code{border:1px solid #456178;background:#102236;border-radius:12px;padding:13px}.code strong{display:block;letter-spacing:2px;font-size:19px;margin-top:5px}.bar{height:7px;border-radius:10px;background:#24394e;overflow:hidden}.bar div{height:100%;background:#68d391}.answers{display:grid;gap:5px}.answers span{font-size:13px;color:#c0d0df}.nav{display:flex;gap:7px}footer{margin-top:30px;font-size:12px;color:#96aabf;text-align:center}</style></head><body><header><div class="wrap"><h1>⚽ Das große Fußballquiz</h1><span class="pill">8 Teams · 5 Runden</span></div></header><main class="wrap"><section id="entry" class="card"><h2>Willkommen zum Kneipenquiz!</h2><p class="muted">Ein Smartphone pro Tisch. Öffnet diesen Link, gebt euren Teamcode ein und spielt gemeinsam.</p><div class="grid"><div><h3>Mit Teamcode beitreten</h3><label for="code">Code vom Moderator</label><input id="code" placeholder="z. B. A1B2C3D4" autocomplete="off" autocapitalize="characters"><button onclick="join()">Als Team beitreten →</button></div><div><h3>Quiz moderieren</h3><label for="pin">Moderator-PIN</label><input id="pin" type="password" placeholder="PIN"><button class="secondary" onclick="loginAdmin()">Moderatorenansicht →</button></div></div><p id="entryMsg" class="error"></p></section><section id="game" class="hide"><div class="row"><span id="identity"></span><button class="secondary" onclick="logout()">Abmelden</button></div><div class="grid" style="margin-top:15px"><div id="content"></div><div id="side"></div></div></section><footer>Fragen mit 1 Punkt · Bonusfragen mit 2 Punkten · 30 Punkte maximal</footer></main><script>
let role=localStorage.getItem('fqRole'),token=localStorage.getItem('fqToken'),state=null,busy=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,data){const opt={headers:{'content-type':'application/json',...(role==='admin'?{'x-admin-pin':token}:role==='team'?{'x-team-code':token}:{})}};if(data!==undefined){opt.method='POST';opt.body=JSON.stringify(data)}const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw Error(j.error||'Verbindung fehlgeschlagen');return j}
function setAuth(r,t){role=r;token=t;localStorage.setItem('fqRole',r);localStorage.setItem('fqToken',t);$('entry').classList.add('hide');$('game').classList.remove('hide');refresh()}
async function join(){try{const code=$('code').value.trim().toUpperCase();const r=await fetch('/api/team/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});const j=await r.json();if(!r.ok)throw Error(j.error);setAuth('team',j.code)}catch(e){$('entryMsg').textContent=e.message}}
async function loginAdmin(){try{const pin=$('pin').value;const r=await fetch('/api/admin',{headers:{'x-admin-pin':pin}});const j=await r.json();if(!r.ok)throw Error(j.error);setAuth('admin',pin)}catch(e){$('entryMsg').textContent=e.message}}
function logout(){localStorage.removeItem('fqRole');localStorage.removeItem('fqToken');role=token=null;state=null;$('entry').classList.remove('hide');$('game').classList.add('hide')}
async function refresh(){if(!role||busy||document.hidden)return;busy=true;try{state=await api(role==='admin'?'/api/admin':'/api/state');render()}catch(e){if(e.message.includes('ungültig'))logout();else if($('content'))$('content').innerHTML=`<div class="card error">${esc(e.message)} – versuche erneut zu verbinden.</div>`}finally{busy=false}}
function rank(){return `<div class="card"><h2>🏆 Live-Rangliste</h2><div>${state.leaderboard.map((t,i)=>`<div class="score"><b>${i+1}.</b><span>${esc(t.name)}</span><b>${t.score}</b></div>`).join('')}</div><p class="muted small">Punkte werden nach jeder Auflösung vergeben.</p></div>`}
function quest(isAdmin){const q=state.question;if(!q)return `<div class="card"><h2>Gleich geht's los!</h2><p class="muted">Der Moderator startet die erste Frage.</p></div>`;let selected=state.answered;const revealed=state.phase==='reveal'||state.phase==='finished';return `<div class="card"><div class="row"><span class="category">Runde ${state.round}: ${esc(q.category)}</span><span class="pill">${q.bonus?'BONUS · 2 Punkte':'1 Punkt'}</span></div><p class="muted small">Frage ${state.current+1} von ${state.total} · ${state.answeredCount} von 8 Teams haben geantwortet</p><div class="bar"><div style="width:${(state.current+1)/state.total*100}%"></div></div><p class="bigq">${esc(q.question)}</p><div class="choices">${q.options.map((o,i)=>`<button class="choice ${!isAdmin&&selected===i?'selected':''} ${revealed&&i===q.correct?'correct':''} ${revealed&&selected===i&&i!==q.correct?'wrong':''}" ${isAdmin||state.phase!=='question'?'disabled':''} onclick="answer(${i})"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>${revealed?`<p class="success">✓ Richtige Antwort: ${'ABCD'[q.correct]} – ${esc(q.options[q.correct])}</p>`:isAdmin?'<p class="muted">Antworten sind geöffnet.</p>':selected===null?'<p class="muted">Wählt gemeinsam eine Antwort. Ihr könnt sie bis zur Auflösung ändern.</p>':'<p class="success">Antwort gespeichert. Änderungen sind bis zur Auflösung möglich.</p>'}</div>`}
function render(){if(!state)return;$('identity').textContent=role==='admin'?'🎙 Moderation':`📱 Team: ${state.teams.find(t=>t.id===teamId)?.name||'Mitspieler'}`;const admin=role==='admin';$('side').innerHTML=rank();if(admin){let ctrl=`<div class="card"><h2>🎛 Moderation</h2><p class="muted">Status: ${esc(state.phase)} · ${state.answeredCount}/8 Antworten</p><div class="nav">${state.phase==='lobby'?'<button onclick="action(\'start\')">Quiz starten</button>':''}${state.phase==='question'?'<button onclick="action(\'reveal\')">Antwort auflösen</button>':''}${state.phase==='reveal'?`<button onclick="action('next')">${state.current===24?'Quiz beenden':'Nächste Frage →'}</button>`:''}</div>${state.phase==='finished'?'<h3>🎉 Quiz beendet!</h3>':''}</div>`;if(state.current>=0)ctrl+=`<div class="card"><h3>Antworten der Teams</h3><div class="answers">${state.answersForCurrent.map(t=>`<span>${esc(t.name)}: ${t.answer===null?'—':'ABCD'[t.answer]}</span>`).join('')}</div></div>`;ctrl+=`<div class="card"><h3>Teamcodes (an Tische verteilen)</h3><div class="codes">${state.teamCodes.map(t=>`<div class="code"><div>${esc(t.name)}</div><strong>${esc(t.code)}</strong></div>`).join('')}</div><p class="small muted">Moderator-PIN und Teamcodes nicht öffentlich projizieren. Teamcodes bleiben für das gesamte Quiz gültig.</p><button class="secondary" onclick="window.print()">Drucken</button></div><div class="card"><h3>Neues Spiel</h3><button class="danger" onclick="resetQuiz()">Spielstand und Teamcodes zurücksetzen</button></div>`;$('content').innerHTML=ctrl+quest(true)}else{$('content').innerHTML=`<div class="card"><h3>Teamname</h3><div class="row"><input id="newName" style="max-width:270px;margin:0" value="${esc(state.teams.find(t=>t.id===teamId)?.name||'')}" maxlength="32"><button class="secondary" onclick="renameTeam()">Speichern</button></div></div>`+quest(false)}}
let teamId=null;async function lookup(){if(role!=='team')return;try{const d=await api('/api/team');teamId=d.id;refresh()}catch{logout()}}
async function answer(i){try{await api('/api/team/answer',{answer:i});await refresh()}catch(e){alert(e.message);refresh()}}
async function renameTeam(){try{await api('/api/team/name',{name:$('newName').value});await refresh()}catch(e){alert(e.message)}}
async function action(a){try{await api('/api/admin/'+a,{});await refresh()}catch(e){alert(e.message)}}
async function resetQuiz(){if(!confirm('Alle Antworten, Teamnamen und Codes unwiderruflich löschen?'))return;try{await api('/api/admin/reset',{confirm:'RESET'});await refresh()}catch(e){alert(e.message)}}
if(role&&token){$('entry').classList.add('hide');$('game').classList.remove('hide');if(role==='team')lookup();else refresh()}const originalSetAuth=setAuth;setAuth=function(r,t){originalSetAuth(r,t);if(r==='team')lookup()};setInterval(refresh,2000);
</script></body></html>
